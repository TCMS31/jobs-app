server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change; the entry point must not be cached.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routing: unknown paths are handled by the React router, not by nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
